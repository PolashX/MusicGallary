<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Music Gallery</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">♫ Cloud Music</a>
  <input id="search" type="search" placeholder="Search title or artist…" autocomplete="off">
</header>

<main>\n


  
<section class="music-hero">
  <div class="hero-content">
    <span class="hero-label">CLOUD MUSIC EXPERIENCE</span>
    <h1>ALL YOUR MUSIC.<br><span>ONE PLACE.</span></h1>
    <p>Discover, upload and enjoy your favourite audio and videos.</p>
    <div class="hero-tags">
      <span>♫ MUSIC</span>
      <span>♫ AUDIO</span>
      <span>▶ VIDEO</span>
    </div>
  </div>
  <div class="hero-art">
    <div class="art-panel art-one"><span>NOW</span><strong>PLAY</strong><small>YOUR SOUND</small></div>
    <div class="art-panel art-two"><span>HOT</span><strong>HITS</strong><small>TOP COLLECTION</small></div>
    <div class="art-panel art-three"><span>NEW</span><strong>VIBES</strong><small>DISCOVER MORE</small></div>
  </div>
</section>

<section id="drop" class="upload-banner">
  <input id="file" type="file"
    accept="audio/*,video/*,.mp3,.wav,.ogg,.flac,.m4a,.aac,.wma,.aiff,.aif,.opus,.mp4,.m4v,.mov,.3gp,.3g2,.webm,.mkv,.avi,.mpeg,.mpg,.wmv,.ts"
    multiple hidden>
  <label for="file" class="upload-button">
    <span class="upload-icon">＋</span>
    <span>Choose Audio or Video</span>
  </label>
  <div id="queue"></div>
</section>


  <h2 id="count">Gallery</h2>
  <section id="grid" class="grid" aria-live="polite"></section>
  <p id="empty" class="muted center" hidden>No tracks yet — upload the first one!</p>
</main>

<footer class="player" id="player" hidden>
  <div class="np"><div class="eq" id="eq"><i></i><i></i><i></i></div>
    <div><div id="npTitle" class="t"></div><div id="npArtist" class="muted"></div></div></div>
  <div class="ctrl">
    <button id="prev" title="Previous">⏮</button>
    <button id="pp" class="pp" title="Play / pause">▶</button>
    <button id="next" title="Next">⏭</button>
  </div>
  <div class="seek"><span id="cur">0:00</span>
    <input id="bar" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <input id="vol" type="range" min="0" max="100" value="80" title="Volume">
</footer>
<audio id="audio" preload="none"></audio>
<div id="toast" class="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
